name: Verify application and research logic
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sentinel_verification
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest tests -q
        working-directory: backend
        env:
          PYTHONPATH: .
          SENTINEL_TEST_DATABASE_URL: postgresql://sentinel_test:test-only-password@localhost:5432/sentinel_verification
